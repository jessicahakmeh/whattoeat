<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>What To Eat</title>
  <meta name="description" content="Shu mnekol? Answer a few quick questions, spin the wheel, and get an idea of what to eat.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="./">What<em>to</em>Eat</a>
    <p class="tagline">Shu mnekol? Let the wheel decide.</p>
  </header>

  <main class="layout" id="layout">
    <section class="panel">
      <ol class="answers" id="answers" aria-label="Your answers"></ol>
      <div class="question" id="question" aria-live="polite"></div>
      <p class="match-count" id="matchCount" aria-live="polite"></p>
    </section>

    <section class="stage" id="stage" aria-label="Meal wheel" hidden>
      <div class="wheel-wrap" id="wheelWrap">
        <div class="pointer" aria-hidden="true"></div>
        <canvas id="wheel" role="img" aria-label="Wheel of meal options"></canvas>
        <button class="hub" id="spinBtn" type="button">Spin</button>
      </div>
      <p class="hint">Click the centre or press <kbd>Space</kbd> to spin</p>
    </section>
  </main>

  <div class="result-backdrop" id="result" hidden>
    <article class="result-card" role="dialog" aria-modal="true" aria-labelledby="resultName">
      <button class="close" id="closeResult" type="button" aria-label="Close">×</button>
      <div class="result-emoji" id="resultEmoji"></div>
      <p class="result-kicker">Tonight you're having…</p>
      <h2 id="resultName"></h2>
      <p class="result-desc" id="resultDesc"></p>
      <ul class="tags" id="resultTags"></ul>
      <h3>You'll need</h3>
      <ul class="ingredients" id="resultIngredients"></ul>
      <div class="result-actions">
        <button class="btn primary" id="respinBtn" type="button">↻ Respin</button>
        <a class="btn" id="recipeLink" target="_blank" rel="noopener">Find a recipe ↗</a>
        <button class="btn ghost" id="restartBtn" type="button">Change answers</button>
      </div>
    </article>
  </div>

  <div class="burst" id="burst" aria-hidden="true"></div>

  <script src="js/meals.js" defer></script>
  <script src="js/questions.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
